<!-- app.component.html -->
<ion-app>
  <ion-router-outlet></ion-router-outlet>
</ion-app>

<!-- ═══════════════════════════════════════════════════
     BOTTOM SHEET MENU OVERLAY
     Dirender di luar ion-app agar z-index tidak
     dibatasi oleh stacking context internal Ionic
     ═══════════════════════════════════════════════════ -->
<div
  *ngIf="radialMenu.isOpen"
  class="menu-sheet-overlay"
  [class.closing]="radialMenu.isClosing"
>
  <!-- Backdrop gelap: klik untuk menutup sheet -->
  <div class="menu-backdrop" (click)="closeMenu()"></div>

  <!-- Bottom Sheet Container tepat di atas tab bar -->
  <div
    class="menu-sheet-container"
    role="dialog"
    aria-modal="true"
    aria-label="Menu navigasi"
  >
    <!-- Handle bar (36x4px, #D1D5DB) -->
    <div class="sheet-handle" aria-hidden="true"></div>

    <!-- Judul Menu (14px, medium) -->
    <div class="sheet-title">Menu</div>

    <!-- Grid 3 kolom untuk item menu -->
    <div class="sheet-grid">
      <button
        *ngFor="let item of radialMenu.items"
        type="button"
        class="sheet-item"
        (click)="selectItem(item)"
        [attr.aria-label]="item.label"
      >
        <div class="sheet-icon-box">
          <ion-icon [name]="item.icon"></ion-icon>
        </div>
        <span class="sheet-label">{{ item.label }}</span>
      </button>
    </div>
  </div>
</div>
