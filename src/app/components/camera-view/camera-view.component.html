<div class="camera-wrapper">
  
  <!-- Tampilan awal: Tombol Kamera Tile .ui-upload -->
  <div 
    *ngIf="!photoPreview" 
    class="ui-upload"
    (click)="takePicture()"
    (touchstart)="onTouchStart($event)"
    (mousedown)="onMouseDown($event)">
    <ion-icon name="camera"></ion-icon>
    <div class="t">{{ buttonText }}</div>
    <div class="s">{{ subText }}</div>
  </div>

  <!-- Tampilan setelah foto diambil: Pratinjau Foto -->
  <div *ngIf="photoPreview" class="preview-box ion-text-center">
    <div class="image-container">
      <img [src]="photoPreview" class="preview-image" alt="Pratinjau foto" />
    </div>
    
    <ion-button 
      (click)="retakePicture()" 
      fill="clear"
      color="danger" 
      size="small" 
      class="ion-margin-top delete-photo-btn">
      <ion-icon slot="start" name="trash-outline"></ion-icon>
      Hapus foto
    </ion-button>
  </div>

</div>
