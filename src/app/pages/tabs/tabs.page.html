<ion-tabs>

  <ion-router-outlet></ion-router-outlet>

  <!-- TAB BAR UNTUK DRIVER -->
  <ion-tab-bar slot="bottom" *ngIf="userRole === 'driver'" class="custom-tab-bar">

    <ion-tab-button tab="driver/attendance" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="home-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Beranda</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="driver/customers" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="people-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Cust</ion-label>
    </ion-tab-button>

    <!-- MAIN MENU BUTTON -->
    <div class="main-menu-slot">
      <button
        class="main-menu-btn"
        [class.holding]="isHolding"
        (mousedown)="onHoldStart($event)"
        (touchstart)="onHoldStart($event)"
        (mouseup)="onHoldEnd($event)"
        (touchend)="onHoldEnd($event)"
        (mouseleave)="cancelHold()"
      >
        <div class="main-menu-circle">
          <ion-icon name="grid-outline" class="main-icon"></ion-icon>
        </div>
        <span class="main-label">Menu</span>
      </button>
    </div>

    <ion-tab-button tab="driver/salary" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="wallet-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Gaji</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="driver/leave" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="calendar-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Cuti</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

  <!-- TAB BAR UNTUK SALES -->
  <ion-tab-bar slot="bottom" *ngIf="userRole === 'sales'" class="custom-tab-bar">

    <ion-tab-button tab="sales/dashboard" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="speedometer-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="sales/attendance" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="location-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Absen</ion-label>
    </ion-tab-button>

    <!-- MAIN MENU BUTTON -->
    <div class="main-menu-slot">
      <button
        class="main-menu-btn"
        [class.holding]="isHolding"
        (mousedown)="onHoldStart($event)"
        (touchstart)="onHoldStart($event)"
        (mouseup)="onHoldEnd($event)"
        (touchend)="onHoldEnd($event)"
        (mouseleave)="cancelHold()"
      >
        <div class="main-menu-circle">
          <ion-icon name="grid-outline" class="main-icon"></ion-icon>
        </div>
        <span class="main-label">Menu</span>
      </button>
    </div>

    <ion-tab-button tab="sales/daily-report" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="document-text-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Laporan</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="sales/history" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="time-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Riwayat</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
