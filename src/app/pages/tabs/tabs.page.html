<ion-tabs (ionTabsDidChange)="onTabChange()">

  <ion-router-outlet></ion-router-outlet>

  <!-- TAB BAR UNTUK KO / KASIR -->
  <ion-tab-bar slot="bottom" *ngIf="isKoRole" class="custom-tab-bar">

    <ion-tab-button tab="ko/attendance" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="location-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Presensi</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="ko/checksheets" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="clipboard-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Checksheet</ion-label>
    </ion-tab-button>

    <!-- MAIN MENU BUTTON -->
    <div class="main-menu-slot">
      <button
        type="button"
        class="main-menu-btn"
        (click)="toggleMenu()"
        aria-label="Menu"
      >
        <div class="main-menu-circle">
          <ion-icon [name]="menuOpen ? 'close' : 'grid-outline'" class="main-icon"></ion-icon>
        </div>
        <span class="main-label">Menu</span>
      </button>
    </div>

    <ion-tab-button tab="ko/deliveries" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="checkmark-done-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Approval</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="ko/kpi" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="stats-chart-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">KPI</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

  <!-- TAB BAR UNTUK DRIVER -->
  <ion-tab-bar slot="bottom" *ngIf="userRole === 'driver'" class="custom-tab-bar">

    <ion-tab-button tab="driver/attendance" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="home-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Presensi</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="driver/inspection" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="speedometer-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Inspeksi</ion-label>
    </ion-tab-button>

    <!-- MAIN MENU BUTTON -->
    <div class="main-menu-slot">
      <button
        type="button"
        class="main-menu-btn"
        (click)="toggleMenu()"
        aria-label="Menu"
      >
        <div class="main-menu-circle">
          <ion-icon [name]="menuOpen ? 'close' : 'grid-outline'" class="main-icon"></ion-icon>
        </div>
        <span class="main-label">Menu</span>
      </button>
    </div>

    <ion-tab-button tab="driver/bulk-delivery" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="clipboard-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Rekap order</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="driver/salary" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="wallet-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Gaji</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

  <!-- TAB BAR UNTUK SALES -->
  <ion-tab-bar slot="bottom" *ngIf="userRole === 'sales'" class="custom-tab-bar">

    <ion-tab-button tab="sales/dashboard" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="speedometer-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="sales/attendance" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="location-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Absen</ion-label>
    </ion-tab-button>

    <!-- MAIN MENU BUTTON -->
    <div class="main-menu-slot">
      <button
        type="button"
        class="main-menu-btn"
        (click)="toggleMenu()"
        aria-label="Menu"
      >
        <div class="main-menu-circle">
          <ion-icon [name]="menuOpen ? 'close' : 'grid-outline'" class="main-icon"></ion-icon>
        </div>
        <span class="main-label">Menu</span>
      </button>
    </div>

    <ion-tab-button tab="sales/daily-report" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="document-text-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Laporan</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="sales/history" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="time-outline" class="tab-icon"></ion-icon>
      </div>
      <ion-label class="tab-label">Riwayat</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
